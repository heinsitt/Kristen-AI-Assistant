<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Kristen — personal AI Superagent</title>
  <desc id="dsc">HUD style banner: an arc reactor ring system beside the name Kristen, with telemetry meters, corner brackets and a slow scanline. Personal AI Superagent running on Base44.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F6FBFE"/>
      <stop offset="55%" stop-color="#E6F1F8"/>
      <stop offset="100%" stop-color="#FCFEFF"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#A7C6D7" stroke-opacity="0.55" stroke-width="0.6"/>
    </pattern>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="34%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#0A6E88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A6E88" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A6E88" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0A6E88" stop-opacity="0.078"/>
      <stop offset="100%" stop-color="#0A6E88" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FC0CF"/>
      <stop offset="65%" stop-color="#0A6E88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="hudrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A6E88" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0A6E88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A6E88" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A6E88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0A6E88" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A6E88" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </radialGradient>

    <clipPath id="frame"><rect x="0" y="0" width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)" opacity="0.75"/>
    <rect width="1000" height="300" fill="url(#vig)"/>
  <g transform="translate(170 150)">
    <circle r="132" fill="url(#coreHalo)"/>

    <circle r="100" fill="none" stroke="#0A6E88" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="88" fill="none" stroke="#0A6E88" stroke-opacity="0.42" stroke-width="10" stroke-dasharray="1.2 6.6"/>
    <circle r="104" fill="none" stroke="#0A6E88" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="26 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="64s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle r="79" fill="none" stroke="#0A6E88" stroke-opacity="0.85" stroke-width="2.4" stroke-dasharray="48 12 6 12"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="67" fill="none" stroke="#0A6E88" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="16 7"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="56" fill="none" stroke="#B45309" stroke-opacity="0.55" stroke-width="3.2"
              stroke-dasharray="9 27" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle r="45" fill="url(#core)"/>
    <circle r="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.55;0.15;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.75;0.3;0.75" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#FFFFFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#0A6E88" stroke-opacity="0.6" stroke-width="1.2">
      <path d="M0,-112 V-104"/><path d="M0,112 V104"/>
      <path d="M-112,0 H-104"/><path d="M112,0 H104"/>
    </g>
  </g>
    <g stroke="#0A6E88" stroke-opacity="0.5" stroke-width="1">
      <path d="M300 150 H326"/>
      <path d="M326 150 v-6" stroke-opacity="0.6"/>
    </g>
    <circle cx="300" cy="150" r="3" fill="#0A6E88" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <text x="344" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="3.2" fill="#0A6E88">PERSONAL AI AGENT · SYSTEM ONLINE</text>

    <text x="340" y="164" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="7" fill="#06121B">KRISTEN</text>

    <g>
      <path d="M344 182 H596" stroke="url(#hudrule)" stroke-width="1.6"/>
      <g stroke="#0A6E88" stroke-opacity="0.45" stroke-width="1">
        <path d="M360 178 v8"/><path d="M392 180 v4"/><path d="M424 178 v8"/>
        <path d="M456 180 v4"/><path d="M488 178 v8"/><path d="M520 180 v4"/>
      </g>
      <circle cx="344" cy="182" r="4" fill="none" stroke="#B45309" stroke-opacity="0.9" stroke-width="1.6">
        <animate attributeName="stroke-opacity" values="0.9;0.25;0.9" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="344" y="212" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4C6675">Research · Planning · Writing · Execution</text>

    <text x="344" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.6" letter-spacing="1.9" fill="#4C6675" opacity="0.9">LINK BASE44 · MODE ASSIST · SESSION ACTIVE</text>
  <g>
    <rect x="694" y="66" width="252" height="152" rx="4" fill="#FFFFFF" opacity="0.55"/>
    <path d="M694 80 H694 V66 H708" fill="none" stroke="#0A6E88" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M932 66 H946 V80" fill="none" stroke="#0A6E88" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M694 204 V218 H708" fill="none" stroke="#0A6E88" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M932 218 H946 V204" fill="none" stroke="#0A6E88" stroke-opacity="0.55" stroke-width="1.6"/>
    <text x="712" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="2.6" fill="#4C6675">TELEMETRY</text>
    <circle cx="926" cy="85" r="2.6" fill="#B45309">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="712" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.8" fill="#4C6675">CORE</text>
    <rect x="796" y="114" width="132" height="5" rx="2.5" fill="#0A6E88" opacity="0.14"/>
    <rect x="796" y="114" width="96" height="5" rx="2.5" fill="url(#bar)">
      <animate attributeName="width" values="96;120;96" dur="5.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="712" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.8" fill="#4C6675">REASONING</text>
    <rect x="796" y="140" width="132" height="5" rx="2.5" fill="#0A6E88" opacity="0.14"/>
    <rect x="796" y="140" width="108" height="5" rx="2.5" fill="url(#bar)">
      <animate attributeName="width" values="108;132;108" dur="7.5s" begin="-1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="712" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.8" fill="#4C6675">TOOLING</text>
    <rect x="796" y="166" width="132" height="5" rx="2.5" fill="#0A6E88" opacity="0.14"/>
    <rect x="796" y="166" width="92" height="5" rx="2.5" fill="url(#bar)">
      <animate attributeName="width" values="92;116;92" dur="6.2s" begin="-3.1s" repeatCount="indefinite"/>
    </rect>
    <text x="712" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="1.8" fill="#4C6675">MEMORY</text>
    <rect x="796" y="192" width="132" height="5" rx="2.5" fill="#0A6E88" opacity="0.14"/>
    <rect x="796" y="192" width="118" height="5" rx="2.5" fill="url(#bar)">
      <animate attributeName="width" values="118;142;118" dur="8.4s" begin="-2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="712" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.4" letter-spacing="1.9" fill="#4C6675" opacity="0.85">BASE44 NODE · READY</text>
  </g>
  <text x="34" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="2.4" fill="#4C6675">AI SUPERAGENT // INTERFACE</text>
  <g>
    <path d="M18 40 V18 H40" fill="none" stroke="#0A6E88" stroke-opacity="0.4" stroke-width="1.4"/>
    <path d="M982 40 V18 H960" fill="none" stroke="#0A6E88" stroke-opacity="0.4" stroke-width="1.4"/>
    <path d="M18 260 V282 H40" fill="none" stroke="#0A6E88" stroke-opacity="0.4" stroke-width="1.4"/>
    <path d="M982 260 V282 H960" fill="none" stroke="#0A6E88" stroke-opacity="0.4" stroke-width="1.4"/>
  </g>
    <rect x="0" y="-140" width="1000" height="140" fill="url(#scan)">
      <animate attributeName="y" values="-140;300" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="rgba(6,18,27,0.10)"/>
</svg>
